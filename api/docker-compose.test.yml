version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=test
      - POSTGRES_USER=test
      - POSTGRES_PASSWORD=test
    ports:
      - "5432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test -h 127.0.0.1 -p 5432"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-test-data:
