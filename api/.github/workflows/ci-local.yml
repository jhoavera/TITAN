name: CI local (act)

on:
  push: {}
  workflow_dispatch: {}

jobs:
  ci-local:
    name: Verificación local (act compatible)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalación de dependencias
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun install
          else
            npm ci --no-audit --no-fund
          fi

      - name: Install Bun (for test execution)
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: '1.3.4'

      - name: Ejecutar test de métricas (aislar carpeta propuestas)
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun test test/servicios/limpieza-repo.metrics.test.ts
          else
            echo "Bun not installed; skipping metrics-isolation test"
          fi

      - name: Ejecutar tests de Glosario (unit + E2E aisladas)
        run: |
          if command -v bun >/dev/null 2>&1; then
            bun test test/pruebas/integracion/e2e-glosario-flujo.prueba.ts
            bun test test/pruebas/unit/repositorio-glosario.unit.test.ts
          else
            echo "Bun not installed; skipping glosario tests"
          fi

      - name: Ejecutar verificación ligera
        run: |
          ./scripts/ci/run-local-ci.sh
