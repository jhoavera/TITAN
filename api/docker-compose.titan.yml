version: '3.8'
services:
  postgres:
    image: postgres:15.6
    environment:
      POSTGRES_USER: titan
      POSTGRES_DB: titan
      POSTGRES_PASSWORD: titan_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backup/postgres:/var/backups/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan || exit 1"]
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command: ["redis-server", "--save", "900 1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    environment:
      QDRANT__storage__path: /qdrant/storage
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-dump:/qdrant/dump
    restart: unless-stopped

  dragonfly:
    # Temporalmente sustituido por Redis para proveer funcionalidad de cache local.
    image: redis:7.2.4
    ports:
      - "7379:6379"
    volumes:
      - dragonfly-data:/data
    restart: unless-stopped

  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    restart: unless-stopped

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    volumes:
      - victoria-data:/victoria
    restart: unless-stopped

  consul:
    image: consul:1.14
    ports:
      - "8500:8500"
    command: agent -dev -client=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8500/v1/status/leader || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    environment:
      - CONSUL_HTTP_ADDR=consul:8500
    command: -config.file=/etc/loki/local-config.yaml -config.expand-env=true
    depends_on:
      consul:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  nats:
    image: nats:2.11
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  # inference: (omitted) - Servicio de inferencia comentado temporalmente porque la imagen ghcr.io/llamafile/llamafile:latest requiere autenticación.
  # Para habilitarlo, reemplace la imagen por una pública o realice login a GHCR y restaure este bloque.

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  dragonfly-data:
  qdrant-data:
  qdrant-dump:
  prometheus-data:
  grafana-data:
  victoria-data:
  loki-data:
  minio-data:
