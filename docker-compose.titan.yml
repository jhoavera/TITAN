version: '3.8'
services:
  postgres:
    image: postgres:15.6
    environment:
      POSTGRES_USER: titan
      POSTGRES_DB: titan
      POSTGRES_PASSWORD: titan_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backup/postgres:/var/backups/postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U titan -d titan || exit 1"]
    restart: unless-stopped

  redis:
    image: redis:7.2.4
    command: ["redis-server", "--save", "900 1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    # usar latest como fallback si no existe la versión exacta
    image: qdrant/qdrant:latest
    environment:
      QDRANT__storage__path: /qdrant/storage
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-dump:/qdrant/dump
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:6333/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  dragonfly:
    # usar latest como fallback para evitar tags no disponibles en Docker Hub
    image: dragonflydb/dragonfly:latest
    ports:
      - "7379:7379"
    command: ["--maxmemory=2GB","--proactor_threads=4"]
    healthcheck:
      test: ["CMD-SHELL", "dragonfly --version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - dragonfly-data:/data
    restart: unless-stopped

  traefik:
    image: traefik:v3.0
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    restart: unless-stopped

  victoria-metrics:
    image: victoriametrics/victoria-metrics:latest
    ports:
      - "8428:8428"
    volumes:
      - victoria-data:/victoria
    restart: unless-stopped

  loki:
    image: grafana/loki:2.8.2
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-15
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  nats:
    image: nats:2.11
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  inference:
    # Placeholder service for local inference (llamafile/vLLM). Replace image with preferred inference image.
    image: ghcr.io/llamafile/llamafile:latest
    environment:
      - LLAMAFILE_GPU=0
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  dragonfly-data:
  qdrant-data:
  qdrant-dump:
  prometheus-data:
  grafana-data:
  victoria-data:
  loki-data:
  minio-data:
